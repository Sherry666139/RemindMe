<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f6fb">
<title>RemindMe</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" style="visibility:hidden">
  <header>
    <button class="ib" id="hback" data-act="hback" style="display:none"></button>
    <h1 id="htitle">Today</h1>
    <button class="ib" data-act="search" aria-label="Search"></button>
    <button class="ib" data-act="assistant" aria-label="Assistant"></button>
    <button class="ib" data-act="settings" aria-label="Settings"></button>
  </header>
  <div id="main"></div>
  <button id="fab" data-act="fab" aria-label="Add"></button>
  <div id="composer" style="display:none">
    <button class="ib sec" data-act="aimic" aria-label="Speak"></button>
    <input id="aiinput" placeholder="e.g. Pay rent on 1st at 10am, 2 days before" autocomplete="off">
    <button class="ib" data-act="aisend" aria-label="Send"></button>
  </div>
  <nav>
    <button data-act="tab" data-v="today"><span data-i="home"></span>Today</button>
    <button data-act="tab" data-v="tasks"><span data-i="tasks"></span>Tasks</button>
    <button data-act="tab" data-v="routine"><span data-i="routine"></span>Routine</button>
    <button data-act="tab" data-v="notes"><span data-i="notes"></span>Notes</button>
    <button data-act="tab" data-v="vault"><span data-i="vault"></span>Vault</button>
  </nav>
</div>
<div id="search">
  <div class="top"><button class="ib" data-act="scl"></button><input id="sq" placeholder="Search everything…" autocomplete="off"></div>
  <div class="res" id="sres"></div>
</div>
<div id="sheet"></div>
<div id="lock">
  <div class="logo"></div>
  <h3 id="lockmsg" style="margin:0">Enter your PIN</h3>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <div id="locksub" style="margin-top:18px;min-height:40px"></div>
</div>
<div id="toast"></div>
<input type="file" id="restoreFile" accept=".json,application/json,text/plain,*/*" style="display:none">
<script src="js/core.js"></script>
<script src="js/sched.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script>
  (function () {
    var set = function (sel, html) { var e = document.querySelector(sel); if (e) e.innerHTML = html; };
    set('#hback', I.back); set('[data-act=search]', I.search); set('[data-act=assistant]', I.spark); set('[data-act=settings]', I.gear);
    set('#fab', I.plus); set('[data-act=aimic]', I.mic); set('[data-act=aisend]', I.send); set('[data-act=scl]', I.back); set('#lock .logo', I.bell);
    document.querySelectorAll('[data-i]').forEach(function (s) { s.outerHTML = I[s.getAttribute('data-i')]; });
  })();
</script>
<script src="js/main.js"></script>
</body>
</html>
