name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Install optional plugins (voice, location)
        run: |
          npm install @capacitor-community/speech-recognition@^6.0.0 || echo "voice plugin skipped"
          npm install @capacitor-community/background-geolocation@^1.2.0 || echo "location plugin skipped"
      - name: Generate tones
        run: python3 gen_sounds.py
      - name: Create Android project
        run: npx cap add android
      - name: Add permissions and tones
        run: |
          mkdir -p android/app/src/main/res/raw
          cp sounds/*.wav android/app/src/main/res/raw/
          python3 - <<'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ['POST_NOTIFICATIONS', 'SCHEDULE_EXACT_ALARM', 'USE_EXACT_ALARM', 'VIBRATE', 'RECEIVE_BOOT_COMPLETED', 'USE_BIOMETRIC', 'RECORD_AUDIO', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION', 'ACCESS_BACKGROUND_LOCATION', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_LOCATION', 'WAKE_LOCK']
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in perms if 'android.permission.%s"' % x not in s)
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w').write(s)
          PYEOF
      - name: Sync
        run: npx cap sync android
      - name: Use fixed signing key (so future updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: bash build.sh
      - name: Show what was built
        if: always()
        run: cat build-info.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Collect output
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/RemindMe.apk
          cp build-info.txt out/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RemindMe-APK
          path: out/
