name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Install optional plugins (voice, location)
        run: |
          npm install @capacitor-community/speech-recognition@^6.0.0 || echo "voice plugin skipped"
          npm install @capacitor-community/background-geolocation@^1.2.0 || echo "location plugin skipped"
      - name: Generate tones
        run: python3 gen_sounds.py
      - name: Create Android project
        run: npx cap add android
      - name: Inject native alarm engine
        run: python3 native/patch.py
      - name: Sync
        run: npx cap sync android
      - name: Use fixed signing key (so future updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: bash build.sh 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Publish build log on failure
        if: failure()
        run: |
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan buildlog
          git rm -rf --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          grep -n -E "error:|ERROR|FAILURE|What went wrong|e: " /tmp/build.log | head -200 > errors.txt || true
          tail -300 /tmp/build.log > tail.txt
          git add errors.txt tail.txt
          git commit -m "build log ${GITHUB_RUN_ID}"
          git push -f origin buildlog
      - name: Show what was built
        if: always()
        run: cat build-info.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Collect output
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/RemindMe.apk
          cp build-info.txt out/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RemindMe-APK
          path: out/
      - name: Publish APK to apk branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --cached . > /dev/null 2>&1 || true
          rm -rf /tmp/apkout && cp -r out /tmp/apkout
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/apkout/* .
          git add RemindMe.apk build-info.txt
          git commit -m "APK build ${GITHUB_RUN_ID}"
          git push -f origin apk
